server {
    listen 80;
    listen [::]:80;

    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compression des ressources textuelles : CSS/JS/JSON/SVG.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xhtml+xml
        image/svg+xml;

    # Le HTML reste revalidable : les noms des assets Vite changent à chaque build.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    # Assets Vite fingerprintés : cache long et immutable.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Images conservant un nom stable : cache long mais révisable.
    location /images/ {
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    location = /health {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }
}
