<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Operius — solutions techniques du terrain au logiciel : réseaux, infrastructure, automatisation, développement et IA." />
    <!-- Apparence : applique le thème enregistré avant le premier rendu, pour éviter un flash.
         Même clé de stockage, même valeur par défaut et même résolution que `src/theme.ts`. -->
    <script>
      (function () {
        var choice = null;
        try {
          choice = window.localStorage.getItem('site-theme');
        } catch (error) {
          choice = null;
        }
        if (choice !== 'light' && choice !== 'dark' && choice !== 'system') {
          choice = 'system';
        }
        var dark =
          typeof window.matchMedia === 'function' &&
          window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme =
          choice === 'system' ? (dark ? 'dark' : 'light') : choice;
      })();
    </script>
    <!-- Favicon en ligne (SVG) : reprend le monogramme du site, sans fichier binaire à ajouter. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2316a34a'/%3E%3Ctext x='16' y='23' font-family='system-ui,sans-serif' font-size='19' font-weight='700' fill='%23ffffff' text-anchor='middle'%3EO%3C/text%3E%3C/svg%3E"
    />
    <title>Operius</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
